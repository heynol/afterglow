<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Afterglow Shader Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --bg: #0e0f12; --panel: #1b1c21; --text: #e8eaed; --muted: #9aa0a6; --accent: #8ab4f8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: var(--panel); }
  header label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  select, button, input { font: inherit; color: var(--text); background: #2a2b31; border: 1px solid #3a3b42; border-radius: 8px; padding: 4px 8px; }
  button.on { background: var(--accent); color: #111; }
  main { padding: 12px 16px; }
  canvas { display: block; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; }
  #params { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 10px 0; color: var(--muted); }
  #log { white-space: pre-wrap; color: #ff8a80; font: 12px/1.35 ui-monospace, monospace; }
  #stats { color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <strong>Afterglow Shader Lab</strong>
  <label>Visual <select id="visual"></select></label>
  <label>Palette <select id="palette"><option value="">(default)</option></select></label>
  <label>Speed <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"></label>
  <label>React <input id="react" type="range" min="0.5" max="2" step="0.05" value="1"></label>
  <label>Scale <select id="scale"><option>1</option><option>0.9</option><option>0.8</option><option>0.75</option><option>0.7</option><option>0.6</option><option selected>0.5</option><option>0.42</option><option>0.35</option></select></label>
  <button id="grid">Grid</button>
  <button id="pause">Pause</button>
  <span id="stats"></span>
</header>
<main>
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="params"></div>
  <div id="log"></div>
</main>
<script>
// Mirrors dev.heynol.afterglow.render: same shader prelude, uniforms, stroke pass and feedback
// ping-pong. Audio is faked (124 BPM kick/snare/hats, bassline, chords) for visual tuning.
const ASSETS = '../../app/src/main/assets/';
const HIST_BINS = 128, HIST_ROWS = 96, HIST_RATE = 30;
const $ = (id) => document.getElementById(id);
const log = (msg) => { $('log').textContent += msg + '\n'; };

const canvas = $('c');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, premultipliedAlpha: true });
const floatTargets = !!gl.getExtension('EXT_color_buffer_float');

let catalog, common, strokeProg, presentProg;
const programs = new Map();
const instances = new Map();
const vao = gl.createVertexArray();

async function text(path) {
  const r = await fetch(ASSETS + path + '?v=' + Date.now());
  if (!r.ok) throw new Error(path + ': ' + r.status);
  return r.text();
}

function compile(type, src, name) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const lines = src.split('\n');
    const info = gl.getShaderInfoLog(s);
    const m = /0:(\d+)/.exec(info);
    const ctx = m ? '\n  > ' + lines[+m[1] - 1] : '';
    throw new Error(`${name}: ${info}${ctx}`);
  }
  return s;
}

function link(vsSrc, fsSrc, name) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc, name + '.vert'));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc, name + '.frag'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name + ': ' + gl.getProgramInfoLog(p));
  p.u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const base = info.name.replace(/\[0\]$/, '');
    p.u[base] = gl.getUniformLocation(p, info.name);
  }
  return p;
}

function texture(w, h, internal, format, type, filter) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function target(w, h) {
  const tex = floatTargets
    ? texture(w, h, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, gl.LINEAR)
    : texture(w, h, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fbo, w, h };
}

// ---- Fake audio ---------------------------------------------------------------------------
const audioTex = texture(512, 5, gl.R16F, gl.RED, gl.FLOAT, gl.LINEAR);
const histTex = texture(HIST_BINS, HIST_ROWS, gl.R16F, gl.RED, gl.FLOAT, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT); // ring buffer, as AudioTextures
const audio = new Float32Array(512 * 5);
const peakHold = new Float32Array(512), peakVel = new Float32Array(512);
const smooth = new Float32Array(512);
const A = { bass: 0, mid: 0, treble: 0, level: 0, bassHit: 0, beat: 0, beatCount: 0, energy: 0.6 };
let histHead = 0, histAcc = 0, lastBeat = -1;

const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am F C G
const gauss = (x, w) => Math.exp(-(x * x) / (2 * w * w));

function fakeAudio(t, dt) {
  const bpm = 124, beatLen = 60 / bpm;
  const beats = t / beatLen, beatPhase = beats % 1, bar = Math.floor(beats / 4);
  const section = Math.floor(bar / 8) % 4;           // 0 drop, 1 groove, 2 breakdown, 3 build
  const drums = section === 2 ? 0 : 1;
  const kick = drums * Math.exp(-beatPhase * 9);
  const snare = drums * ((Math.floor(beats) % 2) === 1 ? Math.exp(-beatPhase * 12) : 0);
  const hat = drums * Math.exp(-((beats * 2) % 1) * 18) * 0.8;
  const chord = CHORDS[bar % 4];
  const bassNote = midi(chord[0] - 24);
  const energyTarget = [0.95, 0.7, 0.3, 0.6][section];
  A.energy += (energyTarget - A.energy) * Math.min(1, dt * 0.5);
  const pad = section === 2 ? 1.0 : 0.6;

  for (let i = 0; i < 512; i++) {
    const x = i / 511;
    const f = 30 * Math.pow(16000 / 30, x);
    const lf = Math.log2(f);
    let v = 0.42 - 0.3 * x + 0.05 * Math.sin(i * 0.37 + t * 3.1) * Math.sin(i * 0.11 - t * 1.7);
    v += kick * 0.75 * gauss(lf - Math.log2(58), 0.45);
    v += 0.55 * drums * gauss(lf - Math.log2(bassNote), 0.12) * (0.6 + 0.4 * Math.sin(beats * Math.PI));
    for (const n of chord) for (let h = 1; h <= 5; h++) v += pad * 0.32 / h * gauss(lf - Math.log2(midi(n) * h), 0.03);
    v += snare * 0.45 * gauss(lf - Math.log2(2500), 1.4);
    v += hat * 0.4 * Math.max(0, (x - 0.72) * 3.2);
    v *= 0.55 + 0.6 * A.energy;
    v = Math.max(0, Math.min(1, v));
    const a = v > smooth[i] ? 1 - Math.exp(-dt / 0.03) : 1 - Math.exp(-dt / 0.25);
    smooth[i] += (v - smooth[i]) * a;
    audio[i] = smooth[i];
    audio[512 + i] = v;
  }
  for (let i = 0; i < 512; i++) {
    const s = i / 48000 * 2;
    let l = 0, r = 0;
    l += 0.55 * drums * Math.sin(2 * Math.PI * bassNote * s + t * 2);
    r += 0.55 * drums * Math.sin(2 * Math.PI * bassNote * s + t * 2 + 0.3);
    chord.forEach((n, k) => {
      l += 0.22 * pad * Math.sin(2 * Math.PI * midi(n + 12) * s * 1.002 + k + t * 5);
      r += 0.22 * pad * Math.sin(2 * Math.PI * midi(n + 12) * s * 0.998 + k * 1.7 + t * 5);
    });
    l += kick * 0.6 * Math.sin(2 * Math.PI * 55 * s);
    r += kick * 0.6 * Math.sin(2 * Math.PI * 55 * s);
    const n = (Math.random() - 0.5) * hat * 0.25;
    audio[1024 + i] = Math.max(-1, Math.min(1, (l + n) * 0.8));
    audio[1536 + i] = Math.max(-1, Math.min(1, (r - n) * 0.8));
  }
  const follow = (cur, target, up, down) => cur + (target - cur) * (1 - Math.exp(-dt / (target > cur ? up : down)));
  A.bass = follow(A.bass, Math.min(1, 0.25 + kick * 0.7 + 0.2 * drums), 0.02, 0.2);
  A.mid = follow(A.mid, 0.35 + 0.35 * pad + snare * 0.3, 0.03, 0.3);
  A.treble = follow(A.treble, 0.2 + hat * 0.6 + snare * 0.2, 0.01, 0.15);
  A.level = follow(A.level, 0.35 + 0.45 * A.energy + kick * 0.2, 0.03, 0.3);
  A.bassHit = kick;
  const beatIndex = drums ? Math.floor(beats) : lastBeat;
  if (beatIndex !== lastBeat) { lastBeat = beatIndex; A.beat = 1; A.beatCount++; }
  A.beat *= Math.exp(-dt / 0.18);

  // Peak hold, as AudioTextures.updatePeaks
  for (let i = 0; i < 512; i++) {
    const v = audio[i] * 0.65 + audio[512 + i] * 0.35;
    const k = 2048 + i;
    if (v >= audio[k]) { audio[k] = v; peakHold[i] = 0.2; peakVel[i] = 0; }
    else if (peakHold[i] > 0) peakHold[i] -= dt;
    else { peakVel[i] += 5 * dt; audio[k] = Math.max(v, audio[k] - peakVel[i] * dt); }
  }
  gl.bindTexture(gl.TEXTURE_2D, audioTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 512, 5, gl.RED, gl.FLOAT, audio);

  histAcc += dt * HIST_RATE;
  while (histAcc >= 1) {
    histAcc -= 1;
    histHead = (histHead + 1) % HIST_ROWS;
    const row = new Float32Array(HIST_BINS);
    for (let i = 0; i < HIST_BINS; i++) row[i] = audio[512 + Math.floor(i * 511 / (HIST_BINS - 1))];
    gl.bindTexture(gl.TEXTURE_2D, histTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, histHead, HIST_BINS, 1, gl.RED, gl.FLOAT, row);
  }
}

// ---- Rendering ----------------------------------------------------------------------------
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16) / 255);

function palette(v) {
  const id = $('palette').value || v.palette;
  return catalog.palettes.find((p) => p.id === id).colors.map(hex);
}

function palSample(cols, t) {
  t = ((t % 1) + 1) % 1 * 4;
  const i = Math.floor(t);
  let f = t - i;
  f = f * f * (3 - 2 * f);
  const a = cols[i], b = cols[(i + 1) % 4];
  return a.map((x, k) => x + (b[k] - x) * f);
}

async function load() {
  catalog = JSON.parse(await text('visuals.json'));
  common = await text('shaders/common.glsl');
  const quad = '#version 300 es\n' + await text('shaders/quad.vert');
  strokeProg = link('#version 300 es\n' + await text('shaders/stroke.vert'), '#version 300 es\n' + await text('shaders/stroke.frag'), 'stroke');
  presentProg = link(quad, '#version 300 es\n' + await text('shaders/present.frag'), 'present');
  for (const v of catalog.visuals) {
    try {
      programs.set(v.id, link(quad, '#version 300 es\n' + common + '\n#line 1\n' + await text('shaders/visuals/' + v.shader + '.frag'), v.shader));
      if (v.composite) programs.set(v.id + ':composite', link(quad, '#version 300 es\n' + common + '\n#line 1\n' + await text('shaders/visuals/' + v.composite + '.frag'), v.composite));
    } catch (e) { log(e.message); }
    $('visual').add(new Option(`${v.name.en} (${v.category})`, v.id));
    v.values = (v.params || []).map((p) => p.default);
  }
  for (const p of catalog.palettes) $('palette').add(new Option(p.name.en, p.id));
  const hash = location.hash.slice(1);
  if (hash && catalog.visuals.some((v) => v.id === hash)) $('visual').value = hash;
  buildParams();
}

function current() { return catalog.visuals.find((v) => v.id === $('visual').value); }

function buildParams() {
  const v = current();
  const box = $('params');
  box.textContent = '';
  (v.params || []).forEach((p, i) => {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'range'; input.min = 0; input.max = 1;
    input.step = p.options ? 1 / (p.options.length - 1) : 0.05;
    input.value = v.values[i];
    input.oninput = () => { v.values[i] = +input.value; };
    label.append(p.name.en + ' ', input);
    box.append(label);
  });
}

function instanceFor(v, w, h) {
  const key = v.id + '@' + w + 'x' + h;
  let inst = instances.get(key);
  if (!inst) {
    inst = { a: target(w, h), b: target(w, h), display: v.composite ? target(w, h) : null, motion: 0, w, h };
    instances.set(key, inst);
  }
  return inst;
}

function renderVisual(v, inst, t, dt, frame) {
  const prog = programs.get(v.id);
  if (!prog) return inst.a;
  const speed = +$('speed').value, react = +$('react').value;
  const cols = palette(v);
  inst.motion += dt * speed * (0.4 + 0.9 * A.energy + 0.5 * A.level);
  const time = t * speed;
  const out = inst.b;
  const p = [0, 1, 2, 3].map((i) => v.values[i] ?? 0);
  const setup = (prog, dst, prevTex) => {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, dst.w, dst.h);
  gl.disable(gl.BLEND);
  gl.useProgram(prog);
  const u = prog.u;
  const set1 = (n, x) => u[n] && gl.uniform1f(u[n], x);
  gl.uniform2f(u.uRes, dst.w, dst.h);
  set1('uTime', time); set1('uDt', dt);
  u.uFrame && gl.uniform1i(u.uFrame, frame);
  set1('uBass', Math.min(A.bass * react, 1.5)); set1('uMid', Math.min(A.mid * react, 1.5));
  set1('uTreble', Math.min(A.treble * react, 1.5)); set1('uLevel', Math.min(A.level * react, 1.5));
  set1('uBassHit', Math.min(A.bassHit * react, 1.5)); set1('uBeat', A.beat); set1('uBeatCount', A.beatCount);
  set1('uEnergy', A.energy); set1('uMotion', inst.motion); set1('uFlash', 0.6);
  set1('uHistHead', histHead); set1('uHistPhase', histAcc);
  u.uHistSize && gl.uniform2f(u.uHistSize, HIST_BINS, HIST_ROWS);
  u.uPal && gl.uniform3fv(u.uPal, cols.flat());
  u.uParam && gl.uniform4f(u.uParam, ...p);
  const bindTex = (name, unit, tex) => {
    if (!u[name]) return;
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(u[name], unit);
  };
  bindTex('uAudio', 0, audioTex);
  bindTex('uHistory', 1, histTex);
  bindTex('uPrev', 2, prevTex);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  setup(prog, out, inst.a.tex);

  if (v.strokes) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(strokeProg);
    const s = strokeProg.u;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, audioTex);
    gl.uniform1i(s.uAudio, 0);
    gl.uniform2f(s.uRes, out.w, out.h);
    for (const st of v.strokes) {
      const level = Math.min(A.level * react, 1);
      const la = st.levelAlpha ?? 0.5;
      const ls = st.levelScale ?? 0;
      gl.uniform1i(s.uMode, { wave: 0, xy: 1, circle: 2 }[st.mode]);
      gl.uniform1i(s.uChannel, st.channel ?? 0);
      gl.uniform2f(s.uCenter, ...(st.center ?? [0, 0]));
      gl.uniform1f(s.uScale, (st.scale ?? 0.3) * (1 - ls + ls * (0.45 + 1.15 * level)));
      gl.uniform1f(s.uRadius, (st.radius ?? 0) * (1 + 0.12 * Math.min(A.bassHit * react, 1.5)));
      gl.uniform1f(s.uRotation, (st.rotation ?? 0) + time * (st.spin ?? 0));
      gl.uniform1f(s.uWidth, (st.width ?? 3) * out.h / 1080);
      gl.uniform3fv(s.uColor, palSample(cols, (st.hue ?? 0) + time * (st.hueSpeed ?? 0)).map((c) => c * (st.brightness ?? 1.2)));
      gl.uniform1f(s.uAlpha, (st.alpha ?? 1) * (1 - la + la * Math.max(0.15, Math.min(1, level * 1.4))));
      gl.drawArrays(gl.TRIANGLES, 0, 511 * 6);
    }
    gl.disable(gl.BLEND);
  }
  inst.b = inst.a;
  inst.a = out;
  if (v.composite) {
    setup(programs.get(v.id + ':composite'), inst.display, out.tex);
    return inst.display;
  }
  return out;
}

function present(v, tex, x, y, w, h, t) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(x, y, w, h);
  gl.useProgram(presentProg);
  const u = presentProg.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(u.uTo, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(u.uFrom, 1);
  gl.uniform1f(u.uMix, 1); gl.uniform1f(u.uOpacity, 1);
  u.uToneFrom && gl.uniform1f(u.uToneFrom, v.tonemap ? 1 : 0);
  u.uToneTo && gl.uniform1f(u.uToneTo, v.tonemap ? 1 : 0);
  u.uTime && gl.uniform1f(u.uTime, t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let gridMode = false, paused = false, last = performance.now(), t = 0, frame = 0, fpsAcc = 0, fpsN = 0;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) renderFrame(dt);
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { $('stats').textContent = `${Math.round(fpsN / fpsAcc)} fps · float targets: ${floatTargets}`; fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(tick);
}

function renderFrame(dt) {
  {
    t += dt;
    frame++;
    fakeAudio(t, dt);
    const scale = +$('scale').value;
    if (gridMode) {
      const cols = Math.ceil(Math.sqrt(catalog.visuals.length));
      const rows = Math.ceil(catalog.visuals.length / cols);
      const tw = Math.floor(canvas.width / cols), th = Math.floor(canvas.height / rows);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      catalog.visuals.forEach((v, i) => {
        const inst = instanceFor(v, tw, th);
        const tex = renderVisual(v, inst, t, dt, frame).tex;
        present(v, tex, (i % cols) * tw, canvas.height - (Math.floor(i / cols) + 1) * th, tw - 2, th - 2, t);
      });
    } else {
      const v = current();
      const w = Math.round(canvas.width * scale), h = Math.round(canvas.height * scale);
      const tex = renderVisual(v, instanceFor(v, w, h), t, dt, frame).tex;
      present(v, tex, 0, 0, canvas.width, canvas.height, t);
    }
  }
}

$('visual').onchange = () => { location.hash = $('visual').value; buildParams(); };
$('grid').onclick = () => { gridMode = !gridMode; $('grid').classList.toggle('on', gridMode); };
$('pause').onclick = () => { paused = !paused; $('pause').classList.toggle('on', paused); };
window.lab = {
  seek(seconds) { t = seconds; },
  setVisual(id) { $('visual').value = id; buildParams(); },
  get paused() { return paused; },
  set paused(p) { paused = p; },
  /** Output size, e.g. lab.size(1920, 1080) to judge sharpness at TV resolution. */
  size(w, h) { canvas.width = w; canvas.height = h; },
  /** The simulated audio features, e.g. lab.audio.beatCount = 160 to jump ten phrases ahead. */
  audio: A,
  /**
   * Renders [frames] frames at 60 fps synchronously (works while the tab is hidden), then posts the
   * canvas as PNG to a local capture server, e.g. lab.capture('pulsar', { at: 12, scale: 0.5 }).
   */
  capture(name, { at = null, scale = null, frames = 90, url = 'http://127.0.0.1:8766/' } = {}) {
    paused = true;
    if (scale != null) $('scale').value = String(scale);
    if (at != null) t = Math.max(0, at - frames / 60);
    for (let i = 0; i < frames; i++) renderFrame(1 / 60);
    return fetch(url + '?name=' + encodeURIComponent(name), { method: 'POST', body: canvas.toDataURL('image/png') }).then((r) => r.text());
  },
};
load().then(() => requestAnimationFrame(tick)).catch((e) => log(e.stack || e.message));
</script>
</body>
</html>
